trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: Playwright_Tests
  displayName: Run Single Playwright Test on Azure Grid

  steps:
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '18.x'

  - script: |
      echo "Node Version:"
      node -v
      echo "NPM Version:"
      npm -v
    displayName: Verify Node Installation

  # Install dependencies from tests folder
  - script: npm ci
    workingDirectory: tests
    displayName: Install Dependencies

  # Run ONLY Calender.spec.js
  - task: AzureCLI@2
    displayName: Run Calender.spec.js (Azure Grid)
    env:
      PLAYWRIGHT_SERVICE_URL: $(PLAYWRIGHT_SERVICE_URL)
      PLAYWRIGHT_SERVICE_RUN_ID: $(Build.DefinitionName)-$(Build.BuildNumber)-$(System.JobAttempt)
    inputs:
      azureSubscription: 'PlaywrightTestSpace'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Running Single Test..."
        npx playwright test tests/Calender.spec.js --config=playwright.service.config.js
      addSpnToEnvironment: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Playwright Report
    inputs:
      targetPath: tests/playwright-report/
      artifact: Playwright-Report
      publishLocation: pipeline